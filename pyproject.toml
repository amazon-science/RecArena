[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recarena"
version = "0.1.0"
readme = "README.md"
description = "A modular recommendation system benchmark framework for reproducible research."
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.0.0",
  "lightning>=2.0.0",
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scikit-learn>=1.0.0",
  "tqdm>=4.62.0",
  "boto3>=1.26.0",
  "s3fs>=2023.1.0",
  "pyarrow>=10.0.0",
  "filelock>=3.0.0",
  "python-dateutil>=2.8.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
graph = ["torch_geometric>=2.0.0"]
analysis = ["scikit-posthocs", "statsmodels", "matplotlib", "scipy"]
all = ["torch_geometric>=2.0.0", "scikit-posthocs", "statsmodels", "matplotlib", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["src/rec_arena"]

[tool.pytest.ini_options]
addopts = [
    "--durations=5",
    "--color=yes",
]
testpaths = [ "tests" ]

[tool.coverage.run]
source_pkgs = ["rec_arena"]
branch = true
parallel = true

[tool.coverage.paths]
"rec_arena" = ["src/rec_arena", "**/site-packages/rec_arena"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff.lint]
isort.known-first-party = ["rec_arena"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252"]
